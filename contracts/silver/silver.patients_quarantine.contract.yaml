# Follows the open data contract standard: https://bitol-io.github.io/open-data-contract-standard/latest/

contract:
  id: silver.patients_quarantine
  version: 1.0.0
  applies_to_product: silver.patients
  status: active

product:
  id: silver.patients_quarantine
  layer: silver
  domain: healthcare_clinical
  owner:
    team: data-engineering
    contact: data-engineering@hospital.org
  description: "Patient records that failed biological or technical validation rules (e.g., missing caseid, age > 120, impossible weight/height). Isolated for data quality monitoring and debugging."
  consumers:
    - name: data_quality_dashboard
      type: dashboard
      access: iceberg_read

interface:
  grain: "1 quarantined event per failed patient record"
  primary_key: [] # No primary key because invalid data might have null or duplicate keys

schema:
  - name: caseid
    type: string
    nullable: true
    description: "Identifier for the surgical case (may be null, which triggers quarantine)."
  - name: age
    type: float
    nullable: true
    description: "Patient's biological age (may be null or outside the 0-120 range)."
  - name: height
    type: float
    nullable: true
    description: "Patient's height in cm (may be outside the 40-250 range)."
  - name: weight
    type: float
    nullable: true
    description: "Patient's weight in kg (may be outside the 2-400 range)."
  - name: error_reason
    type: string
    nullable: false
    description: "Reason why the record was quarantined (e.g., 'Erro biológico (idade/peso/altura) ou ID inválido')."

semantics:
  definitions:
    quarantined_patient_event: "A clinical record that did not pass the mandatory data quality checks for biological limits or structural integrity in the Silver pipeline."

quality: 
  constraints:
    - rule: "no_nulls(error_reason)"
      severity: error
      description: "Every quarantined record must clearly state the reason for its rejection."
  slo:
    freshness: "P95 <= 15m after Bronze ingestion"
    completeness: "100% of invalid records from Bronze must be captured here for auditing."